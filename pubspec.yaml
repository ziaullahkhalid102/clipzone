name: clipzone
description: "ClipZone - TikTok-style short video sharing app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.2.0
  
  # State Management
  provider: ^6.1.0
  
  # Video
  video_player: ^2.9.0
  image_picker: ^1.1.0
  chewie: ^1.8.0
  
  # Auth & Deep Links
  app_links: ^6.3.0
  
  # UI
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  google_fonts: ^6.2.0
  
  # Storage
  shared_preferences: ^2.3.0
  
  # Utils
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
